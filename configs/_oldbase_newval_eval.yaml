data:
  block_size: 128
  prefs_file: data/sft/prefs.jsonl
  raw_dir: data/raw
  sft_extra: data/sft/sft_real.jsonl
  sft_train: data/sft/sft_train.jsonl
  sft_val: data/sft/sft_val.jsonl
  train_file: data/train/train.bin
  train_split: 0.9
  val_file: data/validation/val.bin
dpo:
  base_checkpoint: checkpoints/tiny-18m-sft/last.pt
  batch_size: 4
  beta: 0.1
  checkpoint_dir: checkpoints/tiny-18m-dpo
  lr: 5.0e-05
  max_steps: 30
  warmup_steps: 5
evaluation:
  checkpoint: checkpoints/tiny-18m/last_backup_pre_retrain.pt
  out_examples: outputs/evaluation/oldbase_newval_ejemplos.md
  out_metrics: outputs/evaluation/oldbase_newval_eval.json
  ppl_batches: 50
  qa_max: 60
inference:
  checkpoint: checkpoints/pretraining/final/model.pt
  max_new_tokens: 80
  repetition_penalty: 1.1
  temperature: 0.0
  top_k: 40
  top_p: 0.9
model:
  bias: false
  block_size: 128
  dropout: 0.0
  n_embd: 256
  n_head: 4
  n_layer: 6
  tie_weights: true
  vocab_size: 50257
sft:
  base_checkpoint: checkpoints/tiny-18m/last.pt
  batch_size: 8
  checkpoint_dir: checkpoints/tiny-18m-sft
  eval_every: 100
  grad_clip: 1.0
  lr: 2.0e-05
  max_steps: 40
  warmup_steps: 10
tokenizer:
  corpus_glob: data/raw/*.txt
  encoding: gpt2
  eot_token: 50256
  name: tiktoken
training:
  batch_size: 16
  checkpoint_dir: checkpoints/tiny-18m
  eval_every: 250
  grad_clip: 1.0
  lr: 0.0003
  max_steps: 3000
  resume: true
  save_every: 500
  seed: 42
  warmup_steps: 200
  weight_decay: 0.01
